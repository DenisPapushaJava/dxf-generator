name: Build and test
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - '.vscode/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      windows:
        description: Also check Windows with shared Qt
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/linux-checks.yml

  windows:
    # Releases use the static build instead; don't also build shared Qt on main pushes.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.windows)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Read pinned Qt version
        id: qt
        run: python scripts/release_tools.py qt-outputs >> $env:GITHUB_OUTPUT
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ steps.qt.outputs.version }}
          arch: win64_msvc2022_64
          archives: qtbase
          cache: true
      - name: Build and test Windows desktop (shared Qt, development)
        run: |
          cmake --preset dev-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset dev-windows --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset dev-windows
          exit $LASTEXITCODE
